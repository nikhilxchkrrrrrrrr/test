<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PC Flash Sale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container checkout-page">
        <a href="{{ url_for('product_page', product_id=product.id) }}" class="back-link">← Back to Product</a>

        <div class="checkout-container">
            <div class="checkout-summary">
                <h2>Order Summary</h2>
                <div class="summary-item">
                    <span>{{ product.name }}</span>
                    <span class="price">${{ "%.2f"|format(price) }}</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span class="total-price">${{ "%.2f"|format(price) }}</span>
                </div>
                <div class="discount-info">🔥 30% OFF applied</div>
            </div>

            <div class="checkout-form">
                <h2>Payment Details</h2>
                <form id="payment-form">
                    <input type="hidden" name="product_id" value="{{ product.id }}">
                    <input type="hidden" name="product_name" value="{{ product.name }}">
                    <input type="hidden" name="amount" value="{{ price }}">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Billing Address</label>
                        <input type="text" name="address" placeholder="123 Main St, New York, NY 10001" required>
                    </div>

                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" name="card_number" placeholder="4111 1111 1111 1111" required maxlength="19">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>Expiry Date</label>
                            <input type="text" name="expiry" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group half">
                            <label>CVV</label>
                            <input type="text" name="cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>

                    <button type="submit" class="pay-btn">Pay ${{ "%.2f"|format(price) }}</button>
                </form>

                <div id="payment-result" style="display: none;">
                    <div class="success-message">
                        ✅ Payment Successful!
                        <p>Your order <span id="order-id"></span> has been confirmed.</p>
                        <p>You will receive a confirmation email shortly.</p>
                        <p><a href="{{ url_for('index') }}" style="color: #00d4ff; text-decoration: none;">← Back to Shop</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
